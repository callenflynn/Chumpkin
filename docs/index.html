<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chumpkin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 100%/1.5 system-ui, -apple-system, sans-serif;
      background: #111;
      color: #ddd;
      padding: 2rem;
    }

    main {
      text-align: center;
      max-width: 36rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: #fff;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.125rem;
      color: #aaa;
      margin-bottom: 1.5rem;
    }

    a {
      color: #f0813d;
      text-decoration: none;
      font-weight: 500;
    }

    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Chumpkin</h1>
    <p>A Minecraft server written in Rust.</p>
    <p><a href="https://github.com/callenflynn/Chumpkin">github.com/callenflynn/Chumpkin</a></p>
  </main>
</body>
</html>
